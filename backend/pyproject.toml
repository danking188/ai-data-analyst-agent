[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-data-analyst-backend"
version = "0.1.0"
description = "Contract-first backend for AI Data Analyst Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "boto3>=1.38,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "pyarrow>=19,<24",
  "PyJWT>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
  "sqlalchemy>=2.0.38,<3",
  "uvicorn[standard]>=0.34,<1",
  "xlrd>=2,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<3",
  "PyYAML>=6,<7",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = [
  "boto3.*",
  "botocore.*",
  "joblib.*",
  "pandas.*",
  "pyarrow.*",
  "scipy.*",
  "sklearn.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
