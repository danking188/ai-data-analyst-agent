openapi: 3.1.0
info:
  title: AI Data Analyst Agent API
  version: 1.0.0
  description: |
    AI Data Analyst Agent 前后端共享契约。
    具体通用规则见 API_INTEGRATION_STANDARD.md。
  contact:
    name: AI Data Analyst Agent 项目组
servers:
  - url: http://localhost:8000/api/v1
    description: 本地开发
  - url: /api/v1
    description: 同源部署
tags:
  - name: System
  - name: Auth
  - name: Projects
  - name: Datasets
  - name: Schema
  - name: Quality
  - name: Cleaning
  - name: Analysis
  - name: Runs
  - name: Evidence
  - name: Reports
  - name: Jobs
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: 服务健康检查
      security: []
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: 1.0.0
                timestamp: "2026-07-09T08:30:00Z"
  /system/capabilities:
    get:
      tags: [System]
      operationId: getCapabilities
      summary: 获取部署能力与限制
      responses:
        "200":
          description: 当前部署能力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemCapabilities"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 使用部署账号创建登录会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 注册持久化账号并创建登录会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册并登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: 获取当前登录会话
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 清除登录会话
      security: []
      responses:
        "204":
          description: 已退出登录
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: 查询当前用户可见项目
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived]
      responses:
        "200":
          description: 项目列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Projects]
      operationId: createProject
      summary: 创建项目
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
            example:
              name: 客户流失分析
              description: 分析订阅客户的 30 日流失风险
              timezone: Asia/Shanghai
              language: zh-CN
      responses:
        "201":
          description: 项目创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      operationId: getProject
      summary: 获取项目详情
      responses:
        "200":
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: 更新项目元数据
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: 更新后的项目
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Projects]
      operationId: archiveProject
      summary: 归档项目
      responses:
        "204":
          description: 已归档
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/datasets:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Datasets]
      operationId: listDatasets
      summary: 查询项目数据集
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 数据集列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Datasets]
      operationId: uploadDataset
      summary: 上传数据文件并创建解析任务
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                dataset_name:
                  type: string
                  minLength: 1
                  maxLength: 120
                parse_options:
                  $ref: "#/components/schemas/ParseOptions"
      responses:
        "202":
          description: 上传已接收
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/datasets/{dataset_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags: [Datasets]
      operationId: getDataset
      summary: 获取数据集详情
      responses:
        "200":
          description: 数据集详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/datasets/{dataset_id}/versions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags: [Datasets]
      operationId: listDatasetVersions
      summary: 查询数据版本链
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            type: string
            enum: [creating, ready, failed, archived]
      responses:
        "200":
          description: 数据版本列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersionPage"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/datasets/{dataset_id}/versions/{version_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
      - $ref: "#/components/parameters/VersionId"
    get:
      tags: [Datasets]
      operationId: getDatasetVersion
      summary: 获取数据版本详情
      responses:
        "200":
          description: 数据版本详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetVersion"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/datasets/{dataset_id}/versions/{version_id}/activate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
      - $ref: "#/components/parameters/VersionId"
    post:
      tags: [Datasets]
      operationId: activateDatasetVersion
      summary: 将历史版本设为当前版本
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 更新后的数据集
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/datasets/{dataset_id}/versions/{version_id}/preview:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
      - $ref: "#/components/parameters/VersionId"
    get:
      tags: [Datasets]
      operationId: previewDatasetVersion
      summary: 分页预览数据
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: columns
          in: query
          description: 逗号分隔字段名；为空表示默认列
          schema:
            type: string
      responses:
        "200":
          description: 数据预览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPreview"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/datasets/{dataset_id}/version-comparisons:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
    post:
      tags: [Datasets]
      operationId: compareDatasetVersions
      summary: 比较两个同源数据版本
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionComparisonRequest"
      responses:
        "202":
          description: 比较任务已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/dataset-versions/{version_id}/schema:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/VersionId"
    get:
      tags: [Schema]
      operationId: getDatasetSchema
      summary: 获取字段 Schema
      responses:
        "200":
          description: 字段定义
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSchema"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Schema]
      operationId: updateDatasetSchema
      summary: 提交字段覆盖
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaPatch"
      responses:
        "200":
          description: 更新后的字段定义
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSchema"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/dataset-versions/{version_id}/quality-scans:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/VersionId"
    post:
      tags: [Quality]
      operationId: createQualityScan
      summary: 启动质量扫描
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityScanRequest"
      responses:
        "202":
          description: 质量扫描任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/dataset-versions/{version_id}/quality-issues:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/VersionId"
    get:
      tags: [Quality]
      operationId: listQualityIssues
      summary: 查询质量问题
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: status
          in: query
          schema:
            type: string
            enum: [open, accepted, resolved, ignored]
        - name: issue_type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 质量问题列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityIssuePage"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/quality-issues/{issue_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IssueId"
    patch:
      tags: [Quality]
      operationId: updateQualityIssue
      summary: 更新质量问题处置状态
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityIssueUpdate"
      responses:
        "200":
          description: 更新后的问题
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityIssue"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/cleaning-plans:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Cleaning]
      operationId: listCleaningPlans
      summary: 查询清洗计划
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: source_version_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 清洗计划列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleaningPlanPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Cleaning]
      operationId: createCleaningPlan
      summary: 创建清洗计划
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleaningPlanCreate"
      responses:
        "201":
          description: 清洗计划草稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleaningPlan"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/cleaning-plans/{plan_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/PlanId"
    get:
      tags: [Cleaning]
      operationId: getCleaningPlan
      summary: 获取清洗计划
      responses:
        "200":
          description: 清洗计划
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleaningPlan"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Cleaning]
      operationId: updateCleaningPlan
      summary: 编辑清洗计划草稿
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleaningPlanUpdate"
      responses:
        "200":
          description: 更新后的计划
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleaningPlan"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/cleaning-plans/{plan_id}/preview:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/PlanId"
    post:
      tags: [Cleaning]
      operationId: previewCleaningPlan
      summary: 生成清洗影响预览
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 预览任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/cleaning-plans/{plan_id}/decision:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/PlanId"
    post:
      tags: [Cleaning]
      operationId: decideCleaningPlan
      summary: 批准或拒绝清洗计划
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleaningDecision"
      responses:
        "200":
          description: 决策后的计划
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleaningPlan"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/cleaning-plans/{plan_id}/execute:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/PlanId"
    post:
      tags: [Cleaning]
      operationId: executeCleaningPlan
      summary: 执行已批准清洗计划
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 清洗执行任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/analysis-specs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Analysis]
      operationId: listAnalysisSpecs
      summary: 查询分析定义
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: dataset_version_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 分析定义列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSpecPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Analysis]
      operationId: createAnalysisSpec
      summary: 创建分析定义草稿
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisSpecCreate"
      responses:
        "201":
          description: 分析定义
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSpec"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/analysis-specs/{spec_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/SpecId"
    get:
      tags: [Analysis]
      operationId: getAnalysisSpec
      summary: 获取分析定义
      responses:
        "200":
          description: 分析定义
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSpec"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Analysis]
      operationId: updateAnalysisSpec
      summary: 编辑分析定义草稿并创建新修订
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisSpecUpdate"
      responses:
        "200":
          description: 新修订
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSpec"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/analysis-specs/{spec_id}/confirm:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/SpecId"
    post:
      tags: [Analysis]
      operationId: confirmAnalysisSpec
      summary: 确认分析定义
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 已确认的分析定义
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisSpec"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/runs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Runs]
      operationId: listRuns
      summary: 查询分析运行
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, blocked, succeeded, failed, cancelled]
        - name: dataset_version_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 运行列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRunPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Runs]
      operationId: createRun
      summary: 根据已确认 AnalysisSpec 启动运行
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRunCreate"
      responses:
        "202":
          description: 分析任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Runs]
      operationId: getRun
      summary: 获取运行详情与步骤
      responses:
        "200":
          description: 运行详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/runs/{run_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: 取消分析运行
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 取消后的运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/runs/{run_id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Evidence]
      operationId: listArtifacts
      summary: 查询运行产物
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: type
          in: query
          schema:
            type: string
            enum: [metric, table, chart, model, file, log, comparison]
      responses:
        "200":
          description: 产物列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPage"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/artifacts/{artifact_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Evidence]
      operationId: getArtifact
      summary: 获取产物元数据与展示内容
      responses:
        "200":
          description: 产物详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/artifacts/{artifact_id}/download:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Evidence]
      operationId: createArtifactDownload
      summary: 创建有时效下载地址
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 下载信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Download"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/artifacts/{artifact_id}/file:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Evidence]
      operationId: downloadArtifactFile
      summary: 使用有时效签名下载 Artifact 文件
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact 文件内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/runs/{run_id}/claims:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Evidence]
      operationId: listClaims
      summary: 查询运行结论
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: validation_status
          in: query
          schema:
            type: string
            enum: [pending, passed, failed]
      responses:
        "200":
          description: 结论列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimPage"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/claims/{claim_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ClaimId"
    get:
      tags: [Evidence]
      operationId: getClaim
      summary: 获取结论与证据链
      responses:
        "200":
          description: 结论详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /projects/{project_id}/reports:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Reports]
      operationId: createReportExport
      summary: 创建报告、Notebook、数据或 Manifest 导出
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportExportRequest"
      responses:
        "202":
          description: 导出任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "422":
          $ref: "#/components/responses/ValidationError"
        default:
          $ref: "#/components/responses/Error"
  /jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [Jobs]
      operationId: getJob
      summary: 获取异步任务状态
      responses:
        "200":
          description: 任务状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /jobs/{job_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: 取消异步任务
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 取消后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: datatrace_session
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^prj_[A-Za-z0-9]+$"
    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^ds_[A-Za-z0-9]+$"
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^dsv_[A-Za-z0-9]+$"
    IssueId:
      name: issue_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^issue_[A-Za-z0-9]+$"
    PlanId:
      name: plan_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^cln_[A-Za-z0-9]+$"
    SpecId:
      name: spec_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^spec_[A-Za-z0-9]+$"
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^run_[A-Za-z0-9]+$"
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^art_[A-Za-z0-9]+$"
    ClaimId:
      name: claim_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^claim_[A-Za-z0-9]+$"
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^job_[A-Za-z0-9]+$"
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: field:asc 或 field:desc
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 资源 revision，格式为双引号包围的整数
      schema:
        type: string
        example: '"3"'
  responses:
    Unauthorized:
      description: 登录凭证缺失、无效或已过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error:
      description: 错误响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在或不可见
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: 资源不存在或无权访问
              request_id: req_01JABC
              retryable: false
              details: {}
    Conflict:
      description: 当前状态或重复请求冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreconditionFailed:
      description: 客户端资源版本已过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VERSION_CONFLICT
              message: 资源已被修改，请刷新后重试
              request_id: req_01JABC
              retryable: false
              details:
                current_revision: 4
    ValidationError:
      description: 业务校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    FileTooLarge:
      description: 文件超过当前部署限制
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMedia:
      description: 不支持的文件或媒体类型
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Health:
      type: object
      required: [status, version, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        timestamp:
          type: string
          format: date-time
    SystemCapabilities:
      type: object
      required:
        - api_version
        - supported_file_types
        - max_upload_bytes
        - natural_language_analysis
        - auth_enabled
      properties:
        api_version:
          type: string
          example: v1
        supported_file_types:
          type: array
          items:
            type: string
            enum: [csv, xls, xlsx, parquet]
        max_upload_bytes:
          type: integer
          minimum: 1
          example: 524288000
        natural_language_analysis:
          type: boolean
        auth_enabled:
          type: boolean
        polling:
          $ref: "#/components/schemas/PollingPolicy"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 1
          maxLength: 500
          format: password
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$"
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
    SessionInfo:
      type: object
      required: [subject_id]
      properties:
        subject_id:
          type: string
        expires_in_seconds:
          type: [integer, "null"]
          minimum: 1
    PollingPolicy:
      type: object
      required: [initial_interval_ms, steady_interval_ms, background_interval_ms]
      properties:
        initial_interval_ms:
          type: integer
          example: 1000
        steady_interval_ms:
          type: integer
          example: 3000
        background_interval_ms:
          type: integer
          example: 10000
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name, timezone, language]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 2000
        timezone:
          type: string
          example: Asia/Shanghai
        language:
          type: string
          enum: [zh-CN, en-US]
    ProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 2000
        timezone:
          type: string
        language:
          type: string
          enum: [zh-CN, en-US]
    Project:
      type: object
      required:
        - project_id
        - name
        - timezone
        - language
        - status
        - revision
        - created_at
        - updated_at
      properties:
        project_id:
          type: string
          example: prj_01JABC
        name:
          type: string
        description:
          type: [string, "null"]
        timezone:
          type: string
        language:
          type: string
        status:
          type: string
          enum: [active, archived]
        current_dataset_version_id:
          type: [string, "null"]
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Project"
    ParseOptions:
      type: object
      additionalProperties: false
      properties:
        encoding:
          type: [string, "null"]
        delimiter:
          type: [string, "null"]
          maxLength: 4
        header_row:
          type: integer
          minimum: 0
          default: 0
        sheet_name:
          type: [string, "null"]
        date_format_hint:
          type: [string, "null"]
    Dataset:
      type: object
      required:
        - dataset_id
        - project_id
        - name
        - source_type
        - status
        - created_at
      properties:
        dataset_id:
          type: string
          example: ds_01JABC
        project_id:
          type: string
        name:
          type: string
        source_type:
          type: string
          enum: [csv, xls, xlsx, parquet]
        status:
          type: string
          enum: [active, archived]
        current_version_id:
          type: [string, "null"]
        version_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    DatasetPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Dataset"
    DatasetVersion:
      type: object
      required:
        - version_id
        - dataset_id
        - project_id
        - version_number
        - status
        - kind
        - file_hash
        - row_count
        - column_count
        - created_at
      properties:
        version_id:
          type: string
          example: dsv_01JABC
        dataset_id:
          type: string
        project_id:
          type: string
        version_number:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [creating, ready, failed, archived]
        kind:
          type: string
          enum: [raw, cleaned, modeled]
        parent_version_id:
          type: [string, "null"]
        source_file_name:
          type: string
        sheet_name:
          type: [string, "null"]
        file_hash:
          type: string
          pattern: "^sha256:[a-fA-F0-9]{64}$"
        row_count:
          type: integer
          minimum: 0
        column_count:
          type: integer
          minimum: 0
        operation_summary:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    DatasetVersionPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/DatasetVersion"
    DataPreview:
      type: object
      required: [columns, rows, has_more, masked_columns]
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/PreviewColumn"
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
        masked_columns:
          type: array
          items:
            type: string
    PreviewColumn:
      type: object
      required: [name, physical_type]
      properties:
        name:
          type: string
        physical_type:
          type: string
        semantic_type:
          type: [string, "null"]
        masked:
          type: boolean
          default: false
    VersionComparisonRequest:
      type: object
      additionalProperties: false
      required: [base_version_id, compare_version_id]
      properties:
        base_version_id:
          type: string
        compare_version_id:
          type: string
        include_sample_changes:
          type: boolean
          default: true
    DatasetSchema:
      type: object
      required: [dataset_version_id, revision, columns, low_confidence_count]
      properties:
        dataset_version_id:
          type: string
        revision:
          type: integer
          minimum: 1
        low_confidence_count:
          type: integer
          minimum: 0
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnSchema"
    ColumnSchema:
      type: object
      required:
        - name
        - physical_type
        - semantic_type
        - analysis_role
        - confidence
        - evidence
        - sensitive
      properties:
        name:
          type: string
        physical_type:
          type: string
          enum: [integer, float, string, boolean, datetime, binary, unknown]
        semantic_type:
          type: string
          enum:
            - numeric
            - categorical
            - datetime
            - boolean
            - identifier
            - text
            - currency
            - percentage
            - ordinal
            - geographic_code
            - unknown
        analysis_role:
          type: string
          enum: [feature, target, entity_key, time, identifier, text, excluded, undecided]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence:
          type: array
          items:
            type: string
        date_format:
          type: [string, "null"]
        ordinal_values:
          type: [array, "null"]
          items:
            type: string
        sensitive:
          type: boolean
        user_confirmed:
          type: boolean
          default: false
    SchemaPatch:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ColumnSchemaPatch"
        reason:
          type: [string, "null"]
          maxLength: 1000
    ColumnSchemaPatch:
      type: object
      additionalProperties: false
      required: [column]
      properties:
        column:
          type: string
        semantic_type:
          type: string
          enum:
            - numeric
            - categorical
            - datetime
            - boolean
            - identifier
            - text
            - currency
            - percentage
            - ordinal
            - geographic_code
            - unknown
        analysis_role:
          type: string
          enum: [feature, target, entity_key, time, identifier, text, excluded, undecided]
        date_format:
          type: [string, "null"]
        ordinal_values:
          type: [array, "null"]
          items:
            type: string
        sensitive:
          type: boolean
    QualityScanRequest:
      type: object
      additionalProperties: false
      properties:
        analysis_spec_id:
          type: [string, "null"]
        rules:
          type: array
          items:
            type: string
        force:
          type: boolean
          default: false
    QualityIssue:
      type: object
      required:
        - issue_id
        - dataset_version_id
        - issue_type
        - severity
        - status
        - metrics
        - revision
        - created_at
      properties:
        issue_id:
          type: string
          example: issue_01JABC
        dataset_version_id:
          type: string
        issue_type:
          type: string
          example: missing_values
        column:
          type: [string, "null"]
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [open, accepted, resolved, ignored]
        title:
          type: string
        explanation:
          type: string
        metrics:
          type: object
          additionalProperties: true
        sample_rows:
          type: array
