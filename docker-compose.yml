x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-production}
  API_PREFIX: ${API_PREFIX:-/api/v1}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
  DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-300}
  REQUIRE_EXTERNAL_PERSISTENCE: ${REQUIRE_EXTERNAL_PERSISTENCE:-true}
  JOB_EXECUTION_MODE: worker
  DATA_ROOT: ${DATA_ROOT:-/app/data}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  STORAGE_CACHE_ROOT: ${STORAGE_CACHE_ROOT:-/tmp/datatrace-storage-cache}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_PREFIX: ${S3_PREFIX:-datatrace}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
  AUTH_MODE: jwt
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-ai-data-analyst}
  JWT_ISSUER: ${JWT_ISSUER:-ai-data-analyst}
  LOGIN_USERNAME: ${LOGIN_USERNAME:-analyst}
  LOGIN_PASSWORD: ${LOGIN_PASSWORD:?LOGIN_PASSWORD is required}
  REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-datatrace_session}
  CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-datatrace_csrf}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
  LLM_ENABLED: ${LLM_ENABLED:-false}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
  LLM_API_BASE: ${LLM_API_BASE:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_STRUCTURED_OUTPUT_MODE: ${LLM_STRUCTURED_OUTPUT_MODE:-json_schema}
  LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
  LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-24000}
  LLM_MAX_CALLS_PER_TURN: ${LLM_MAX_CALLS_PER_TURN:-4}
  LLM_MAX_TOOL_CALLS_PER_TURN: ${LLM_MAX_TOOL_CALLS_PER_TURN:-8}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
  LLM_DAILY_TOKEN_BUDGET_PER_USER: ${LLM_DAILY_TOKEN_BUDGET_PER_USER:-200000}
  LLM_MAX_CONCURRENT_TURNS_PER_PROJECT: ${LLM_MAX_CONCURRENT_TURNS_PER_PROJECT:-2}
  LLM_CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${LLM_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
  LLM_CIRCUIT_BREAKER_COOLDOWN_SECONDS: ${LLM_CIRCUIT_BREAKER_COOLDOWN_SECONDS:-60}
  LLM_ALLOW_MASKED_SAMPLES: ${LLM_ALLOW_MASKED_SAMPLES:-false}
  LLM_RETENTION_DAYS: ${LLM_RETENTION_DAYS:-30}
  LLM_ARCHIVE_INACTIVE_DAYS: ${LLM_ARCHIVE_INACTIVE_DAYS:-90}
  LLM_CANARY_SUBJECTS: ${LLM_CANARY_SUBJECTS:-}

x-backend-service: &backend-service
  build:
    context: ./backend
  image: ai-data-analyst-backend:${IMAGE_TAG:-local}
  environment: *backend-environment
  restart: unless-stopped
  init: true
  pids_limit: 256
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=512m,mode=1777

services:
  migrate:
    <<: *backend-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    pids_limit: 64

  backend:
    <<: *backend-service
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${API_WORKERS:-2}"
      - --timeout-keep-alive
      - "10"
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    cpus: ${API_CPU_LIMIT:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend-service
    command: ["python", "-m", "app.workers.runner", "--poll-seconds", "1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: ${WORKER_MEMORY_LIMIT:-4g}
    cpus: ${WORKER_CPU_LIMIT:-2.0}
    tmpfs:
      - /tmp:size=2g,mode=1777
    stop_grace_period: 2m

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_API_MODE: real
        VITE_CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-datatrace_csrf}
    image: ai-data-analyst-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.5}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
