name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check app tests
      - run: uv run mypy app
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - run: uv run python scripts/evaluate_llm_release.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - run: git diff --exit-code -- src/api/generated/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contract-and-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: bash scripts/check_repository_hygiene.sh
      - run: bash -n scripts/*.sh
      - run: ruby scripts/validate_openapi.rb docs/api/openapi.yaml
      - run: docker compose --env-file .env.deploy.example config --quiet
      - run: docker compose --env-file .env.deploy.example build
