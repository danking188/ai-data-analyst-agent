name: Release container images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  security:
    uses: ./.github/workflows/security.yml

  publish:
    needs: [ci, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
          - name: pilot
            context: .
            file: Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Normalize image namespace
        id: namespace
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "value=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.namespace.outputs.value }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign image digest with GitHub OIDC
        env:
          IMAGE: ghcr.io/${{ steps.namespace.outputs.value }}-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Write release evidence manifest
        env:
          COMPONENT: ${{ matrix.name }}
          IMAGE: ghcr.io/${{ steps.namespace.outputs.value }}-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p release-evidence
          jq -n \
            --arg component "$COMPONENT" \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_ref "$SOURCE_REF" \
            --arg run_url "$RUN_URL" \
            '{component: $component, image: $image, digest: $digest, source_sha: $source_sha, source_ref: $source_ref, run_url: $run_url, platforms: ["linux/amd64", "linux/arm64"], attestations: ["spdx-sbom", "slsa-provenance"], signature: "sigstore-keyless"}' \
            > "release-evidence/$COMPONENT.json"

      - uses: actions/upload-artifact@v6
        with:
          name: release-evidence-${{ matrix.name }}
          path: release-evidence/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 90
