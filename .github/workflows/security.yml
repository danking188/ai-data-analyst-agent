name: Security audit

on:
  workflow_call:
  pull_request:
  schedule:
    - cron: "20 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.26"
      - run: uv export --project backend --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/backend-requirements.txt
      - run: uvx pip-audit --disable-pip --requirement /tmp/backend-requirements.txt
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend audit --prod --audit-level high

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --load -t datatrace-backend:audit backend
      - run: docker buildx build --load -t datatrace-frontend:audit frontend
      - run: docker buildx build --load -t datatrace-pilot:audit .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datatrace-backend:audit
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datatrace-frontend:audit
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datatrace-pilot:audit
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
